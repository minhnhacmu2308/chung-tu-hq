name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # .env không nằm trong git; CI sinh cấu hình dev tối thiểu (adapter đều là fake, không gọi dịch vụ ngoài).
      - name: Tạo .env cho CI
        run: |
          cat > .env <<EOF
          DATABASE_URL=postgres://kb_app:kb_app@localhost:5433/khaibao
          DATABASE_ADMIN_URL=postgres://kb_admin:kb_admin@localhost:5433/khaibao
          REDIS_URL=redis://localhost:6379
          STORAGE=s3
          S3_ENDPOINT=http://localhost:9000
          S3_BUCKET=khaibao-dev
          S3_ACCESS_KEY_ID=kb_minio
          S3_SECRET_ACCESS_KEY=kb_minio_secret
          APP_MASTER_KEY=$(openssl rand -base64 32)
          APP_URL=http://localhost:3100
          AI_PROVIDER=fake
          CUSTOMS_GATEWAY=fake
          HS_CLASSIFIER=fake
          MAIL=console
          EOF
      - run: pnpm typecheck
      - run: pnpm lint          # design tokens + depcruise ranh giới module
      - run: pnpm test          # vitest (unit + integration với Testcontainers – runner ubuntu có sẵn Docker)
      - run: pnpm eval          # golden set offline (fixtures), không gọi AI, không tốn tiền
      - run: pnpm build         # next build (chế độ mock, không cần backend)
      # So sánh ảnh giao diện – chỉ chạy khi đã có bộ ảnh chuẩn cho Linux (sinh một lần bằng test:visual:update trên Linux)
      - if: hashFiles('packages/ui/visual/__screenshots__/linux/**') != ''
        run: npx playwright install --with-deps chromium && pnpm --filter @kb/ui test:visual
