packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - esbuild

# Cài cả bản native x64 và arm64 (lightningcss, tailwind oxide, next-swc, esbuild): máy Mac M1 chạy được Node arm64
# kể cả khi terminal/Claude Code đang chạy qua Rosetta (x64). Chạy native: `arch -arm64 pnpm dev`.
supportedArchitectures:
  os: [current]
  cpu: [x64, arm64]

# Vá lỗ hổng `pnpm audit` ở dependency gián tiếp khi gói cha chưa ra bản sửa.
# Gỡ từng dòng khi gói cha đã kéo bản an toàn (`pnpm why <gói> -r`).
overrides:
  undici@8: ^8.12.2                              # testcontainers – GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm
  glob@10: ^14.0.2                               # testcontainers>archiver-utils
  minimatch@9: ^11.0.1                           # testcontainers>archiver-utils>glob
  fast-uri@3: ^3.1.9                             # dependency-cruiser>ajv
  fast-xml-parser@5: ^5.12.0                     # @azure/storage-blob
  uuid@8: ^11.1.1                                # exceljs – không lên >=12 (bỏ CJS, exceljs dùng require)
  "@esbuild-kit/core-utils>esbuild": ^0.25.0     # drizzle-kit
